name: MacOS Build

on:
  push:
    branches: [ main ]
  pull_request:
    branches: [ main ]

jobs:
  build:
    runs-on: macos-14 # Используем стабильный образ Apple Silicon

    steps:
    - name: Checkout code
      uses: actions/checkout@v4

    - name: Install Ninja
      run: brew install ninja

    - name: Install Qt
      uses: jurplel/install-qt-action@v3
      with:
        version: '6.6.0' # Более новая версия, стабильнее на Mac
        host: 'mac'
        target: 'desktop'
        arch: 'clang_64' # Это универсальные бинарники (Intel + ARM)

    - name: Install PostgreSQL
      run: brew install postgresql

    - name: Create Build Directory
      run: mkdir build

    - name: Configure CMake
      working-directory: ./build
      run: |
        
        export CMAKE_PREFIX_PATH="/opt/homebrew/opt/postgresql:$CMAKE_PREFIX_PATH"
        
        cmake .. \
        -GNinja \
        -DCMAKE_BUILD_TYPE=Release \
        -DCMAKE_PREFIX_PATH="$Qt6_DIR;/opt/homebrew"

    - name: Build
      working-directory: ./build
      run: ninja

    - name: Deploy (Create .dmg)
      working-directory: ./build
      run: |
        # Создаем образ диска
        macdeployqt StudyMoney.app -dmg -verbose=1
        
    - name: Upload Artifact
      uses: actions/upload-artifact@v4
      with:
        name: StudyMoney-MacOS
        path: build/StudyMoney.dmg
